<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> <!--Bootstrap-->
    <title>readingabookk</title>
    <link rel="stylesheet" href="css/quizCSS.css">
</head>
    <body>
          <!-- This is the navigation bar. When on mobile, it will collapse into a hamburger menu -->
        <!-- Bootstrap JS Bundle -->  
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- Navigation Bar -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Reading a Bookk</a>
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Lists.html">Lists</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Quiz.html">Quiz</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Login.html">Profile</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <!-- switch views -->
            <div class="mode-toggle justify-content-center">
                <button id="nav-creator" onclick="switchMode('creator')" type="button" class="btn active" data-bs-toggle="button" aria-pressed="true">Creator Mode</button>
                <button id="nav-player" class="secondary btn" onclick="switchMode('player')" type="button" data-bs-toggle="button">Player Mode</button>
            </div>

            <!-- create quiz-->
            <div id="creator-view">
                <h2 class="fw-bold">Create Your Quiz!</h2>
                <form id="creator-form" onsubmit="saveQuestion(event)">
                    <div class="form-group container">
                        <div class="row">
                            <div class="col">
                                <p class="fs-5 fw-bold" for="q-text">Question Text</p>
                                <input type="text" id="q-text" required placeholder="e.g., What is the capital of France?">
                            </div>
                        </div>
                    </div>

                    <!-- Select the Answer Options -->
                    <div class="container text-center">
                        <div class="row">
                            <p class="fs-5 fw-bold">Answer Options</p>
                                <div class="option-row col">
                                    <input type="text" class="q-opt" name="option1" required placeholder="Option A">
                                </div>
                                <div class="option-row col">
                                    <input type="text" class="q-opt" name="option2" required placeholder="Option B">
                                </div>
                                <div class="option-row col">
                                    <input type="text" class="q-opt" name="option3" required placeholder="Option C">
                                </div>
                                <div class="option-row col">
                                    <input type="text" class="q-opt" name="option4" required placeholder="Option D">
                                </div>
                        </div>
                    </div>
                    <!-- Pick the Correct Option/answer for the question -->
                    <div class="form-group container text-center">
                        <label for="q-correct" class="fw-bold">Correct Option</label>
                        <select id="q-correct" class="form-select" aria-label="Select the correct option">
                            <option value="0">Option A</option>
                            <option value="1">Option B</option>
                            <option value="2">Option C</option>
                            <option value="3">Option D</option>
                        </select>
                    </div>
                    <!--Add question button-->
                    <button type="submit button" class="AddQuizbtn btn btn-primary" id="liveAlertBtn">Add Question to Quiz</button>
                </form>
                <!-- Display saved questions -->
                <div id="question-list" class="container">
                    <div class="row">
                        <div class="col">
                            <h3 class="fw-bold">Saved Questions (<span id="q-count">0</span>)</h3>
                            <ul id="saved-questions-container"></ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Play quiz, u quiz urself-->       
            <div id="player-view" class="hidden container">
                <h2 class="fw-bold">Test Yourself!</h2> 
                <div id="quiz-active">
                    <div class="row">
                        <div class="col">
                            <h3 id="player-question-text"></h3>
                        </div>
                        <div class="row">
                            <div id="player-options-container"></div>
                        </div>
                        <div class="col">
                            <p>Score: <span id="current-score">0</span></p>
                        </div>
                    </div>
                </div>
                <!-- Display message when no questions are there -->
                <div id="quiz-empty" class="hidden container">
                    <div class="row">
                        <div class="col">
                            <p>No questions added yet. Go back to Creator Mode to build your quiz!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

      <script src="Javascript/QuizJS.js"></script>
    </body>
</html>
