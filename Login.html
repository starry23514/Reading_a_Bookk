<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> <!--Bootstrap-->
        <title>readingabookk</title>
        <link rel="stylesheet" href="css/loginCSS.css">
    </head>
<body>
    <!--This is the navigation bar. When on mobile, it will collapse into a hamburger menu-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Reading a Bookk</a>
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Lists.html">Lists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Quiz.html">Quiz</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Login.html">Profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="form-section">
            <!-- Login Form -->
            <div class="form-container active" id="loginForm">
                <h1 class="form-title">Welcome Back</h1>
                <p class="form-subtitle">Sign in back to your account</p>
                
                <form id="loginFormSubmit">
                    <div class="form-group">
                        <input type="email" class="form-control" placeholder="Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" class="form-control" placeholder="Password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    
                    <div class="forgot-password">
                        <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-spinner loading"></i>
                        <span class="btn-text">Sign In</span>
                    </button>
                </form>
                
                <div class="form-switch">
                    Don't have an account? <a href="#" onclick="showSignup()">Create one</a>
                </div>
            </div>
            
            <!-- Signup Form -->
            <div class="form-container" id="signupForm">
                <h1 class="form-title">Create Account</h1>
                
                <form id="signupFormSubmit">
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="Full Name" required>
                        <i class="fas fa-user"></i>
                    </div>
                    
                    <div class="form-group">
                        <input type="email" class="form-control" placeholder="Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" class="form-control" placeholder="Password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" class="form-control" placeholder="Confirm Password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-spinner loading"></i>
                        <span class="btn-text">Create Account</span>
                    </button>
                </form>
                <div class="form-switch text-center">
                    Already have an account? <a href="#" onclick="showLogin()">Sign in</a>
                </div>
            </div>
            <!-- Forgot Password Form -->
            <div class="form-container" id="forgotForm">
                <h1 class="form-title">Reset Password</h1>
                
                <form id="forgotFormSubmit">
                    <div class="form-group">
                        <input type="email" class="form-control" placeholder="Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-spinner loading"></i>
                        <span class="btn-text">Send Reset Instructions</span>
                    </button>
                </form>
                
                <div class="form-switch">
                    Remember your password? <a href="#" onclick="showLogin()">Sign in</a>
                </div>
            </div>
        </div>
        
        <div class="image-section">
            <div class="floating-shapes"></div>
            <div class="image-content">
                <h2>Hello!</h2>
                <p>Enter your details to get started</p>
            </div>
        </div>
        <script src="Javascript/loginJS.js"></script>
    </div>
</body>
</html>
