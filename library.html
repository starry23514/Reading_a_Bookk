<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My First Web Page</title>
    </head>
    <body>

    <header class="navbar">
        <div class="logo">Bookstore</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by title, author, or genre...">
            <button onelick="searchBooks()">Search</button>
        </div>
    </header>

    <!-- 2. Main Library Container -->
    <main class="library-container">
        <!-- Sidebar for Categories -->
        <aside class="sidebar">
            <h3>Categories</h3>
            <ul>
                <li onclick="filterCategory('all')">All Books</li>
                <li onclick="filterCategory('fiction')">Fiction</li>
                <li onclick="filterCategory('non-fiction')">Non-Fiction</li>
                <li onclick="filterCategory('sci-fi')">Sci-Fi</li>
            </ul>
        </aside>

        <!-- Book Grid -->
        <section class="book-grid" id="bookGrid">
            <!-- Book items will be injected here by JavaScript -->
        </section>
    </main>


    </body>
</html>
